
name: Release ZirGozar

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  WAILS_VERSION: v2.16.0

jobs:
  test:
    name: Release pre-check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Prepare frontend embed directory
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/index.html

      - name: Download Xray
        run: bash scripts/download-xray.sh

      - name: Generate Wails bindings
        run: wails generate module

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run Go tests
        run: go test ./...

  build:
    name: Build ${{ matrix.platform }}
    needs: test

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux

          - os: windows-latest
            platform: windows

          - os: macos-latest
            platform: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            dpkg-dev

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Prepare frontend embed directory
        shell: bash
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/index.html

      - name: Download Xray
        shell: bash
        run: bash scripts/download-xray.sh

      - name: Generate Wails bindings
        shell: bash
        run: wails generate module

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build application
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            wails build -tags webkit2_41

          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            wails build -nsis

          else
            wails build
          fi

      # Linux DEB package
      - name: Package Linux DEB
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          APP_ID="zirgozar"

          APP_BINARY="$(find build/bin \
            -maxdepth 1 \
            -type f \
            -executable \
            ! -iname '*xray*' \
            -print -quit)"

          if [[ -z "$APP_BINARY" ]]; then
            echo "Application binary not found."
            ls -lah build/bin/
            exit 1
          fi

          PKG_ROOT="dist/${APP_ID}_${VERSION}_amd64"

          mkdir -p \
            "$PKG_ROOT/DEBIAN" \
            "$PKG_ROOT/usr/bin" \
            "$PKG_ROOT/usr/share/applications" \
            "$PKG_ROOT/usr/share/icons/hicolor/256x256/apps"

          install -m 755 "$APP_BINARY" "$PKG_ROOT/usr/bin/$APP_ID"

          if [[ -f build/appicon.png ]]; then
            install -m 644 \
              build/appicon.png \
              "$PKG_ROOT/usr/share/icons/hicolor/256x256/apps/${APP_ID}.png"
          fi

          cat > "$PKG_ROOT/DEBIAN/control" <<EOF
          Package: ${APP_ID}
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: ZirGozar Team
          Depends: libgtk-3-0t64, libwebkit2gtk-4.1-0
          Description: ZirGozar desktop application
           ZirGozar cross-platform desktop client.
          EOF

          cat > "$PKG_ROOT/usr/share/applications/${APP_ID}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=ZirGozar
          Exec=${APP_ID}
          Terminal=false
          Categories=Network;
          EOF

          if [[ -f build/appicon.png ]]; then
            echo "Icon=${APP_ID}" >> "$PKG_ROOT/usr/share/applications/${APP_ID}.desktop"
          fi

          mkdir -p release-assets

          dpkg-deb --root-owner-group \
            --build "$PKG_ROOT" \
            "release-assets/ZirGozar-${GITHUB_REF_NAME}-linux-amd64.deb"

      # Windows installer
      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          INSTALLER="$(find build/bin \
            -maxdepth 1 \
            -type f \
            -iname '*installer*.exe' \
            -print -quit)"

          if [[ -z "$INSTALLER" ]]; then
            echo "NSIS installer not found."
            ls -lah build/bin/
            exit 1
          fi

          mkdir -p release-assets

          cp "$INSTALLER" \
            "release-assets/ZirGozar-${GITHUB_REF_NAME}-windows-amd64-setup.exe"

      # macOS DMG
      - name: Package macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          APP_BUNDLE="$(find build/bin \
            -maxdepth 1 \
            -type d \
            -name '*.app' \
            -print -quit)"

          if [[ -z "$APP_BUNDLE" ]]; then
            echo "macOS application bundle not found."
            ls -lah build/bin/
            exit 1
          fi

          ARCH="$(uname -m)"

          mkdir -p release-assets

          hdiutil create \
            -volname "ZirGozar" \
            -srcfolder "$APP_BUNDLE" \
            -ov \
            -format UDZO \
            "release-assets/ZirGozar-${GITHUB_REF_NAME}-macos-${ARCH}.dmg"

      - name: Upload platform packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: release-assets
          merge-multiple: true

      - name: Display release assets
        run: ls -lah release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ZirGozar ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
